<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>      عيادة الشفاء التخصصية    </title>
    <link rel="stylesheet" href="health.css">
</head>
<body>

    <div id="container">

 <h1>    عيادة الشفاء التخصصية   </h1>

<p>             نحن هنا لرعايتك الصحية بكل أمان و احترافية           </p>


<div id="image">
    <img src="health.jpg" alt="  صورة العيادة  ">
</div> 


<h2>   أحجز موعدك الآن بكل سهولة  </h2>


<div id="inputs">
    <form id="booking-form" >
 <label for="name">  
    الاسم الكامل:
    <input type="text" id="name" placeholder="  أدخل اسمك الثلاثي   "  >
 </label>
 <label for="phone">
    رقم الهاتف:
<input type="number" id="phone" placeholder="   مثال:0980530932  " >
 </label>
 <label for="service">
    اختر الخدمة:
<select id="service" >
<option value="    استشارة عامة  ">  استشارة عامة  </option>
<option value="   فحص أسنان   ">    فحص أسنان   </option>
<option value="  تخطيط قلب   ">    تخطيط قلب    </option>
<option value="  علاج طبيعي   ">   علاج طبيعي     </option>
</select>
 </label>
 

 <label for="date">
    تاريخ الحجز:
<input type="date" id="date" >
 </label>

<button type="submit">
تأكيد الحجز عبر واتساب


</button>
  
    </form>
</div>






    </div>

   
<script src="health.js"></script>
</body>
</html>
